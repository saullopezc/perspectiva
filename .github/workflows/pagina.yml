# Sitio web de Perspectiva en GitHub Pages: se publica la carpeta que genera
# tools/publicar_web.py (index.html, modulos, fuentes con licencia, SHA256SUMS), y solo
# cuando el workflow "pruebas" termina en verde sobre main: nunca una version con fallos.
# Tambien se puede lanzar a mano (workflow_dispatch).
name: pagina

on:
  workflow_run:
    workflows: [pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # exactamente lo que paso las pruebas
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Carpeta publicable (con su barrido)
        run: python -I tools/publicar_web.py "$RUNNER_TEMP/sitio"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
