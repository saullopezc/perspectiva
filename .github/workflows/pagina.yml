# Sitio web de Perspectiva en GitHub Pages: se publica la carpeta que genera
# tools/publicar_web.py (index.html, modulos, fuentes con licencia, SHA256SUMS), y solo
# a mano (por ejemplo, para volver a publicar una version ya probada). La publicacion automatica, tras las
# pruebas en verde, es el trabajo "pagina" de pruebas.yml.
name: pagina

on:
  workflow_dispatch:   # solo a mano: la publicacion automatica es el trabajo "pagina" de pruebas.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Carpeta publicable (con su barrido)
        run: python -I tools/publicar_web.py "$RUNNER_TEMP/sitio"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
